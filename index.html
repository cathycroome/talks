<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talks: field, subfield and topic tags</title>
<style>
  :root { --bg:#171717; --fg:#eee; --muted:#9a9a9a; color-scheme:dark; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:14px/1.4 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }

  header { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-bottom:12px; }
  h1 { margin:0; font-size:15px; font-weight:600; letter-spacing:-.01em; }
  button { background:none; border:1px solid var(--muted); color:var(--muted); border-radius:4px;
           padding:3px 10px; font:inherit; font-size:11px; cursor:pointer; transition:border-color .15s, color .15s; }
  button:hover, button.active { border-color:var(--fg); color:var(--fg); }
  button.active { background:rgba(255,255,255,.07); }

  #chart { overflow-x:auto; }
  svg { display:block; margin:0 auto; }
  text { fill:var(--fg); font-size:12px; }
  .heading { fill:var(--muted); font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  .halo { paint-order:stroke; stroke:var(--bg); stroke-width:3px; stroke-linejoin:round; }
  .leader { stroke:var(--muted); stroke-opacity:.3; stroke-dasharray:2 3; }

  .ribbon { fill-opacity:.32; transition:fill-opacity .15s; }
  .node, .dot, .arc, .band { transition:opacity .15s; }
  .arc { opacity:.6; }
  .band { opacity:0; }
  .dim .ribbon { fill-opacity:.05; }
  .dim .ribbon.on { fill-opacity:.7; }
  .dim .node, .dim .dot, .dim .arc { opacity:.15; }
  .dim .node.on, .dim .dot.on, .dim .arc.on { opacity:1; }
  .dim .band.on { opacity:.18; }

  #legend { display:flex; flex-wrap:wrap; align-items:center; gap:6px 16px; margin-top:10px; font-size:12px; color:var(--muted); }
  #legend b { font-size:11px; font-weight:400; letter-spacing:.08em; text-transform:uppercase; margin-right:4px; }
  #legend span { cursor:pointer; }
  #legend i { display:inline-block; width:10px; height:10px; margin-right:5px; border-radius:2px; }

  #caption { min-height:5.6em; margin-top:10px; font-size:13px; }
  #caption a { color:inherit; text-decoration:underline; text-underline-offset:2px; }
  #caption small { font-size:11px; color:var(--muted); margin-left:8px; }
</style>
</head>
<body>

<header>
  <h1>Sussex Neuroscience PhD Year 1: Attended Talks</h1>
  <button id="tog-singles">Hide singles</button>
</header>
<div id="chart"><svg id="svg"></svg></div>
<div id="legend"></div>
<div id="caption">&nbsp;</div>

<script>
/* ============================== CONFIG ============================== */
const CONFIG = {
  csv: "export.csv",
  columns: { title: "Talk", speaker: "Speaker", institution: "Associated Institution",
             fields: "Main Field", subs: "Subfield", topics: "Tags", link: "Talk link" },
  // Subfields whose parent field can't be guessed from their name
  parents: { "Artificial Intelligence": "Computer Science", "Creative Computing": "Art" },
  fallback: "Unassigned",
  honorifics: /^(Dr|Prof|Professor)\.?\s+/i,

  // Themes group the tags; listed top to bottom. Unlisted tags go in "Other".
  themes: {
    "Mind, perception & sensation":["Perception", "Interoception", "Illusion", "Vision", "Touch", "Olfaction", "Predictive processing", "Computational neurophenomenology", "Consciousness", "Attention", "Memory", "Reality"],
    "Action & behaviour":         ["Decision making", "Social behaviour", "Agency", "Active inference"],
    "AI, ML & statistics":        ["AI -> cognition and neuro", "Cognition and neuro -> AI", "Deep learning", "Reinforcement learning", "Automated scientific discovery", "Model selection", "Model efficiency", "Statistics", "Explainable / interpretable AI", "Neuro-symbolic AI", "LLMs", "Inductive biases"],
    "Neural data & analysis":     ["Neurophysiology", "fMRI", "EEG", "MEG", "Functional connectivity", "Neural decoding"],
    "Applied & clinical":         ["Dementia", "Biomarker", "Clinical trials", "Psychedelics", "Ethics", "Accessibility", "Blockchain", "Computational psychiatry", "Mental health", "Psychosis"],
  },
  fieldColors: { "Neuroscience":"#ee6a5e", "Cognitive Science":"#c4cf6a", "Philosophy":"#b48ae0",
                 "Psychology":"#5fb58a", "Art":"#6aa7e8", "Computer Science":"#4fc1c9", "Unassigned":"#9c9b95" },
  fieldPalette: ["#ee6a5e","#e0884f","#e9b95f","#5fb58a","#e07aa5","#b48ae0","#6aa7e8","#4fc1c9","#b98b6e","#c4cf6a"],
  themePalette: ["#5aa9c9","#c98cd8","#8fc46a","#f0a04b","#e8667a","#8a8fe0","#d9c05a"],

  unit: 11, top: 50, nodeW: 14, flow: [230, 420],
};

/* ============================== HELPERS ============================== */
const KINDS = ["fields", "subs", "topics"];
const $ = id => document.getElementById(id);
const sum = xs => xs.reduce((a, b) => a + b, 0);
const split = s => (s || "").split(",").map(x => x.trim()).filter(Boolean);
const countBy = (talks, kind) => {
  const c = new Map();
  for (const t of talks) for (const x of t[kind]) c.set(x, (c.get(x) || 0) + 1);
  return c;
};
function svgEl(tag, attrs, parent) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return parent.appendChild(el);
}

/* ============================== DATA ============================== */
function parseCSV(text) {
  const rows = [[]];
  let cell = "", quoted = false;
  const endCell = () => { rows[rows.length - 1].push(cell); cell = ""; };
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') quoted = false;
      else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ",") endCell();
    else if (ch === "\n" || ch === "\r") {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      endCell(); rows.push([]);
    } else cell += ch;
  }
  endCell();
  const [header, ...body] = rows.filter(r => r.some(c => c.trim()));
  if (!header) return [];
  return body.map(r => Object.fromEntries(header.map((h, i) => [h.trim(), r[i] ?? ""])));
}

function readTalks(rows) {
  const { columns: c, honorifics, fallback } = CONFIG;
  const orFallback = xs => xs.length ? xs : [fallback];
  return rows.map(r => ({
    title: (r[c.title] || "").trim(),
    link: (r[c.link] || "").trim(),
    speaker: split(r[c.speaker]).map(n => n.replace(honorifics, "")).join(" & "),
    institution: split(r[c.institution]).join(" / "),
    fields: orFallback(split(r[c.fields])),
    subs: orFallback(split(r[c.subs])),
    topics: split(r[c.topics]),
  })).filter(t => t.title);
}

function describe(t) {
  const title = t.link ? `<a href="${t.link}" target="_blank" rel="noopener">${t.title}</a>` : t.title;
  return title + (t.speaker ? ` (${t.speaker}${t.institution ? ", " + t.institution : ""})` : "");
}

// Ribbons between neighbouring columns, and pairs of fields/tags that share a talk
function buildModel(talks) {
  const counts = Object.fromEntries(KINDS.map(k => [k, countBy(talks, k)]));
  const segs = [new Map(), new Map()];
  const pairs = { fields: new Map(), topics: new Map() };

  for (const talk of talks) {
    for (const s of [0, 1]) {
      const as = talk[KINDS[s]], bs = talk[KINDS[s + 1]];
      for (const a of as) for (const b of bs) {
        const key = a + "\0" + b;
        if (!segs[s].has(key)) segs[s].set(key, { stage: s, a, b, left: 0, right: 0, talks: [] });
        const r = segs[s].get(key);
        r.left += 1 / bs.length;
        r.right += 1 / as.length;
        r.talks.push(talk);
      }
    }
    for (const kind of ["fields", "topics"]) {
      const list = talk[kind];
      for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
        const key = [list[i], list[j]].sort().join("\0");
        if (!pairs[kind].has(key)) pairs[kind].set(key, { kind, tags: [list[i], list[j]], talks: [] });
        pairs[kind].get(key).talks.push(talk);
      }
    }
  }
  return { counts, segs: segs.map(s => [...s.values()]), pairs: { fields: [...pairs.fields.values()], topics: [...pairs.topics.values()] } };
}

/* ============================== LAYOUT + DRAW ============================== */
function draw(talks) {
  const svg = $("svg"), legend = $("legend");
  svg.innerHTML = ""; legend.innerHTML = "<b>Themes</b>"; clearHighlight();
  if (!talks.length) { $("caption").textContent = "No talks found. Check the column names in CONFIG."; return; }

  const { unit, top, nodeW, flow } = CONFIG;
  const gap = hideSingles ? 8 : 4, themeGap = hideSingles ? 20 : 12;
  const { counts, segs, pairs } = buildModel(talks);

  // Order: tags by theme then popularity; fields and subfields level with the tags their talks use
  const themeNames = Object.keys(CONFIG.themes);
  const norm = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "");
  const themeOf = t => { const i = themeNames.findIndex(n => CONFIG.themes[n].some(x => norm(x) === norm(t))); return i < 0 ? themeNames.length : i; };
  const topics = [...counts.topics.keys()].sort((a, b) =>
    themeOf(a) - themeOf(b) || counts.topics.get(b) - counts.topics.get(a) || a.localeCompare(b));
  const topicIndex = new Map(topics.map((t, i) => [t, i]));
  const avgTopic = (kind, name) => {
    const xs = talks.filter(t => t[kind].includes(name)).flatMap(t => t.topics.map(x => topicIndex.get(x)));
    return sum(xs) / xs.length;
  };
  // One-talk fields go last (a single ribbon, so the fewest crossings); on a near-tie the bigger field goes higher
  const single = f => counts.fields.get(f) === 1 ? 1 : 0;
  const fieldPos = f => Math.round(avgTopic("fields", f));
  const fields = [...counts.fields.keys()].sort((a, b) =>
    single(a) - single(b) || fieldPos(a) - fieldPos(b) || counts.fields.get(b) - counts.fields.get(a));
  const parentField = s => {
    if (CONFIG.parents[s]) return CONFIG.parents[s];
    const byName = fields.filter(f => s.toLowerCase().endsWith(f.toLowerCase()) || s.toLowerCase().startsWith(f.toLowerCase()));
    if (byName.length) return byName.sort((a, b) => b.length - a.length)[0];
    const w = new Map();   // otherwise the field most of its talks belong to
    talks.filter(t => t.subs.includes(s)).forEach(t => t.fields.forEach(f => w.set(f, (w.get(f) || 0) + 1 / t.fields.length)));
    return [...w].sort((a, b) => b[1] - a[1] || fields.indexOf(a[0]) - fields.indexOf(b[0]))[0][0];
  };
  const subs = [...counts.subs.keys()].sort((a, b) =>
    fields.indexOf(parentField(a)) - fields.indexOf(parentField(b)) || avgTopic("subs", a) - avgTopic("subs", b));
  const order = { fields, subs, topics };
  const themes = topics.some(t => themeOf(t) === themeNames.length) ? [...themeNames, "Other"] : themeNames;

  const themeColor = g => CONFIG.themePalette[g % CONFIG.themePalette.length];
  const fieldColor = Object.fromEntries(fields.map((f, i) => [f, CONFIG.fieldColors[f] || CONFIG.fieldPalette[i % CONFIG.fieldPalette.length]]));
  const color = { fields: f => fieldColor[f], subs: s => fieldColor[parentField(s)], topics: t => themeColor(themeOf(t)) };

  // Column positions, from measured label widths
  const ctx = document.createElement("canvas").getContext("2d");
  ctx.font = "12px -apple-system, Helvetica, Arial, sans-serif";
  const label = (kind, name) => `${name} (${counts[kind].get(name)})`;
  const textW = s => ctx.measureText(s).width * 1.05;
  const maxW = kind => Math.max(...order[kind].map(n => textW(label(kind, n))));
  const gx = 64;
  const xf = gx + 28 + maxW("fields") + 8 + nodeW;
  const xs = xf + flow[0];
  const xt = xs + nodeW + flow[1];
  const gxr = xt + nodeW + 8 + maxW("topics") + 28;
  const width = Math.round(gxr + 76);

  // Node heights grow sub-linearly with talk count; columns are stretched to the same height
  const nodeH = n => Math.round(Math.pow(n, 0.65) * unit);
  const sizes = Object.fromEntries(KINDS.map(k => [k, order[k].map(n => nodeH(counts[k].get(n)))]));
  const gaps = {
    fields: fields.map((_, i) => i ? gap + 6 : 0),
    subs: subs.map((s, i) => i ? (parentField(subs[i - 1]) === parentField(s) ? gap : themeGap) : 0),
    topics: topics.map((t, i) => i ? (themeOf(topics[i - 1]) === themeOf(t) ? gap : themeGap) : 0),
  };
  const natural = k => sum(sizes[k]) + sum(gaps[k]);
  const height = Math.max(...KINDS.map(natural));
  const nodes = {};
  for (const k of KINDS) {
    const slack = sizes[k].length > 1 ? (height - natural(k)) / (sizes[k].length - 1) : 0;
    let y = top;
    nodes[k] = new Map(order[k].map((name, i) => {
      if (i) y += gaps[k][i] + slack;
      const n = { name, y, h: sizes[k][i], count: counts[k].get(name), inUsed: 0, outUsed: 0, color: color[k](name) };
      y += n.h;
      return [name, n];
    }));
  }
  const mid = n => n.y + n.h / 2;

  const totalHeight = height + top + 30;
  svg.setAttribute("viewBox", `0 0 ${width} ${totalHeight}`);
  svg.setAttribute("width", width);
  svg.setAttribute("height", totalHeight);
  const heading = (x, anchor, text) => svgEl("text", { x, y: 28, class: "heading", "text-anchor": anchor }, svg).textContent = text;
  heading(xf - nodeW - 8, "end", "Main field");
  heading(xs, "start", "Subfield");
  heading(xt + nodeW + 8, "start", "Tags");

  // Theme backgrounds, shown on hover
  const bands = themes.map((_, g) => {
    const ns = topics.filter(t => themeOf(t) === g).map(t => nodes.topics.get(t));
    if (!ns.length) return null;
    const a = ns[0].y - 4, b = ns[ns.length - 1].y + ns[ns.length - 1].h + 4;
    return svgEl("rect", { x: xt - 10, y: a, width: gxr + 16 - (xt - 10), height: b - a, rx: 8, fill: themeColor(g), class: "band" }, svg);
  });

  // Ribbons: stacked on each node in the order of the node they connect to
  const ribbonLayer = svgEl("g", {}, svg);
  segs.forEach((list, s) => {
    const [ka, kb] = [KINDS[s], KINDS[s + 1]];
    const xa = s ? xs + nodeW : xf, xb = s ? xt : xs, mx = (xa + xb) / 2;
    for (const a of order[ka]) list.filter(r => r.a === a).sort((p, q) => order[kb].indexOf(p.b) - order[kb].indexOf(q.b))
      .forEach(r => { const n = nodes[ka].get(a); r.y1 = n.y + n.outUsed; n.outUsed += r.left * (n.h / n.count); });
    for (const b of order[kb]) list.filter(r => r.b === b).sort((p, q) => order[ka].indexOf(p.a) - order[ka].indexOf(q.a))
      .forEach(r => { const n = nodes[kb].get(b); r.y2 = n.y + n.inUsed; n.inUsed += r.right * (n.h / n.count); });
    list.forEach(r => {
      const na = nodes[ka].get(r.a), nb = nodes[kb].get(r.b);
      const w1 = r.left * (na.h / na.count), w2 = r.right * (nb.h / nb.count);
      r.el = svgEl("path", { class: "ribbon", fill: na.color,
        d: `M${xa},${r.y1} C${mx},${r.y1} ${mx},${r.y2} ${xb},${r.y2} L${xb},${r.y2 + w2} C${mx},${r.y2 + w2} ${mx},${r.y1 + w1} ${xa},${r.y1 + w1} Z` }, ribbonLayer);
    });
  });
  const ribbons = segs.flat();

  const nodeEls = [];
  const addNode = (kind, n, x, anchor, textX, cls = "") => {
    const g = svgEl("g", { class: "node" }, svg);
    svgEl("rect", { x, y: n.y, width: nodeW, height: n.h, rx: 2, fill: n.color }, g);
    svgEl("text", { x: textX, y: mid(n) + 4, "text-anchor": anchor, class: cls }, g).textContent = label(kind, n.name);
    nodeEls.push({ kind, name: n.name, el: g });
    onHover(g, () => hoverNode(kind, n.name));
  };
  nodes.fields.forEach(n => addNode("fields", n, xf - nodeW, "end", xf - nodeW - 8));
  nodes.subs.forEach(n => addNode("subs", n, xs, "start", xs + nodeW + 6, "halo"));
  nodes.topics.forEach(n => addNode("topics", n, xt, "start", xt + nodeW + 8));

  // Arcs in the outer margins join fields (left) or tags (right) that share a talk
  const dotEls = [], arcs = [];
  const side = {
    fields: { x: gx, dir: -1, width: k => 4 + 4 * (k - 1), leaderTo: n => xf - nodeW - 8 - textW(label("fields", n.name)) - 8 },
    topics: { x: gxr, dir: 1, width: k => 2 + 2.5 * (k - 1), leaderTo: n => xt + nodeW + 8 + textW(label("topics", n.name)) + 8 },
  };
  for (const kind of ["fields", "topics"]) {
    const s = side[kind];
    for (const name of new Set(pairs[kind].flatMap(p => p.tags))) {
      const n = nodes[kind].get(name);
      const [from, to] = kind === "fields" ? [s.x + 6, s.leaderTo(n)] : [s.leaderTo(n), s.x - 6];
      svgEl("line", { class: "leader", x1: from, x2: to, y1: mid(n), y2: mid(n) }, svg);
      dotEls.push({ kind, name, el: svgEl("circle", { class: "dot", cx: s.x, cy: mid(n), r: kind === "fields" ? 5 : 3.5, fill: n.color }, svg) });
    }
    for (const p of pairs[kind]) {
      p.tags.sort((a, b) => order[kind].indexOf(a) - order[kind].indexOf(b));
      const [a, b] = p.tags.map(t => nodes[kind].get(t));
      const bulge = Math.min(14 + (mid(b) - mid(a)) * 0.2, 54) * 1.33 * s.dir;
      const d = `M${s.x},${mid(a)} C${s.x + bulge},${mid(a)} ${s.x + bulge},${mid(b)} ${s.x},${mid(b)}`;
      const w = s.width(p.talks.length);
      p.el = svgEl("path", { d, fill: "none", stroke: a.color, "stroke-width": w, "stroke-linecap": "round", class: "arc", "pointer-events": "none" }, svg);
      onHover(svgEl("path", { d, fill: "none", stroke: "transparent", "stroke-width": Math.max(w, 10) }, svg), () => hoverArc(p));
      arcs.push(p);
    }
  }

  themes.forEach((name, g) => {
    if (!bands[g]) return;
    const span = legend.appendChild(document.createElement("span"));
    span.innerHTML = `<i style="background:${themeColor(g)}"></i>${name}`;
    onHover(span, () => hoverTheme(g));
  });

  /* ============================== INTERACTION ============================== */
  const sentence = (title, ts) => `${title} (${ts.length} talk${ts.length === 1 ? "" : "s"}): ${ts.map(describe).join(" · ")}`;

  function highlight(chosen, caption, band = -1, onlyTopics = null) {
    const lit = Object.fromEntries(KINDS.map(k => [k, new Set(chosen.flatMap(t => t[k]))]));
    if (onlyTopics) lit.topics = new Set([...lit.topics].filter(t => onlyTopics.has(t)));
    const used = r => r.talks.some(t => chosen.includes(t));
    svg.classList.add("dim");
    for (const { kind, name, el } of [...nodeEls, ...dotEls]) el.classList.toggle("on", lit[kind].has(name));
    ribbons.forEach(r => r.el.classList.toggle("on", used(r) && (!onlyTopics || r.stage === 0 || onlyTopics.has(r.b))));
    arcs.forEach(p => p.el.classList.toggle("on", used(p) && p.tags.every(t => lit[p.kind].has(t))));
    bands.forEach((b, i) => b && b.classList.toggle("on", i === band));
    $("caption").innerHTML = caption + (locked ? "<small>· click again or click outside to unlock</small>" : "");
  }
  function hoverNode(kind, name) {
    const ts = talks.filter(t => t[kind].includes(name));
    highlight(ts, sentence(name, ts));
  }
  function hoverArc(p) { highlight(p.talks, sentence(p.tags.join(" + "), p.talks)); }
  function hoverTheme(g) {
    const inTheme = new Set(topics.filter(t => themeOf(t) === g));
    const ts = talks.filter(t => t.topics.some(x => inTheme.has(x)));
    highlight(ts, sentence(themes[g], ts), g, inTheme);
  }
}

// Hover previews; click locks the highlight until the next click
let locked = false;
function onHover(el, handler) {
  el.style.cursor = "pointer";
  el.addEventListener("mouseenter", () => { if (!locked) handler(); });
  el.addEventListener("mouseleave", () => { if (!locked) clearHighlight(); });
  el.addEventListener("click", () => {
    if (locked) clearHighlight();
    else { locked = true; handler(); }
  });
}
function clearHighlight() {
  locked = false;
  $("svg").classList.remove("dim");
  $("caption").innerHTML = "&nbsp;";
}
document.addEventListener("click", e => {
  if (locked && !e.target.closest("#chart, #legend, #caption")) clearHighlight();
});

/* ============================== LOAD + HIDE SINGLES ============================== */
let allTalks = [], hideSingles = false;

// Drop fields, subfields and tags used by only one talk; repeat until nothing changes,
// since removing one can leave another with a single talk
function visibleTalks() {
  if (!hideSingles) return allTalks;
  let talks = allTalks;
  for (let i = 0; i < 10; i++) {
    const counts = Object.fromEntries(KINDS.map(k => [k, countBy(talks, k)]));
    const next = talks
      .map(t => ({ ...t, ...Object.fromEntries(KINDS.map(k => [k, t[k].filter(x => counts[k].get(x) > 1)])) }))
      .filter(t => t.fields.length && t.subs.length);
    const same = JSON.stringify(next) === JSON.stringify(talks);
    talks = next;
    if (same) break;
  }
  return talks;
}

$("tog-singles").addEventListener("click", () => {
  hideSingles = !hideSingles;
  $("tog-singles").classList.toggle("active", hideSingles);
  $("tog-singles").textContent = hideSingles ? "Show singles" : "Hide singles";
  draw(visibleTalks());
});

fetch(CONFIG.csv)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(text => { allTalks = readTalks(parseCSV(text)); draw(allTalks); })
  .catch(err => { $("caption").textContent = `Could not load ${CONFIG.csv} (${err.message}). Is it next to this page and served over http?`; });
</script>
</body>
</html>
